<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Panaghiusa 2026 - QR Check-in</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #1a237e, #311b92, #4a148c, #880e4f);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        #result {
            color: white;
            font-size: 1.1rem;
            margin: 20px 0;
            min-height: 24px;
        }

        .success-message {
            color: white;
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.2;
            text-transform: uppercase;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: pulse 2s infinite;
            margin: 40px 0;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin: 40px 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
            display: inline-block;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-active {
            background-color: #4CAF50;
        }

        .status-inactive {
            background-color: #ff9800;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: white;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .glass-card {
                padding: 25px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .success-message {
                font-size: 2.5rem;
            }
            
            .error-message {
                font-size: 2rem;
            }
            
            #reader {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .glass-card {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .success-message {
                font-size: 2rem;
            }
            
            .error-message {
                font-size: 1.6rem;
            }
            
            .button {
                padding: 15px 30px;
                font-size: 1.1rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Camp Panaghiusa 2026</h1>
            <div class="subtitle">QR Code Check-in System</div>
            
            <div class="status-container">
                <span class="status-indicator status-active" id="statusIndicator"></span>
                <span id="statusText">Ready to scan</span>
            </div>
            
            <div id="reader"></div>
            
            <div id="result"></div>
            
            <div id="successDisplay" class="hidden">
                <div class="success-message" id="successMessage"></div>
                <button id="scanNextBtn" class="button">Scan Next Person</button>
            </div>
            
            <div id="errorDisplay" class="hidden">
                <div class="error-message">INVALID OR FAILED CHECK-IN</div>
                <button id="retryBtn" class="button">Try Again</button>
            </div>
            
            <button id="startScannerBtn" class="button hidden">Start Scanner</button>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://n8n.rootinize.team/webhook/event-checkin';
        let html5QrCode = null;
        let isProcessing = false;
        let scannerActive = false;

        function updateStatus(text, isActive = true) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            statusText.textContent = text;
            indicator.className = 'status-indicator ' + (isActive ? 'status-active' : 'status-inactive');
        }

        function showSuccess(name) {
            const successDisplay = document.getElementById('successDisplay');
            const successMessage = document.getElementById('successMessage');
            const scanner = document.getElementById('reader');
            const result = document.getElementById('result');
            
            scanner.classList.add('hidden');
            result.classList.add('hidden');
            successDisplay.classList.remove('hidden');
            
            successMessage.textContent = `Hi ${name.toUpperCase()}, WELCOME TO CAMP PANAGHIUSA 2026`;
            updateStatus('Check-in successful', false);
        }

        function showError() {
            const errorDisplay = document.getElementById('errorDisplay');
            const scanner = document.getElementById('reader');
            const result = document.getElementById('result');
            
            scanner.classList.add('hidden');
            result.classList.add('hidden');
            errorDisplay.classList.remove('hidden');
            updateStatus('Check-in failed', false);
        }

        function resetUI() {
            const successDisplay = document.getElementById('successDisplay');
            const errorDisplay = document.getElementById('errorDisplay');
            const scanner = document.getElementById('reader');
            const result = document.getElementById('result');
            const startBtn = document.getElementById('startScannerBtn');
            
            successDisplay.classList.add('hidden');
            errorDisplay.classList.add('hidden');
            scanner.classList.remove('hidden');
            result.classList.remove('hidden');
            startBtn.classList.add('hidden');
            
            result.textContent = '';
            updateStatus('Ready to scan');
            isProcessing = false;
            
            // Ensure scanner is properly stopped before restarting
            stopScanner();
            scannerActive = false;
            html5QrCode = null;
            
            // Small delay before restarting scanner
            setTimeout(() => {
                startScanner();
            }, 100);
        }

        async function processQRCode(decodedText) {
            if (isProcessing) return;
            
            isProcessing = true;
            updateStatus('Processing check-in...');
            
            try {
                // Parse the QR code URL to extract the code parameter
                let codeParam = decodedText;
                
                // If it's a URL, extract the code parameter
                if (decodedText.includes('n8n.rootinize.team/webhook/event-checkin')) {
                    try {
                        const url = new URL(decodedText);
                        codeParam = url.searchParams.get('code');
                        if (!codeParam) {
                            throw new Error('No code parameter found in QR URL');
                        }
                    } catch (e) {
                        console.error('Failed to parse QR URL:', e);
                        // If not a valid URL, use the whole text as code
                    }
                }
                
                // Send the code parameter to webhook - use GET for sheet updates
                const url = new URL(WEBHOOK_URL);
                url.searchParams.append('code', codeParam);
                
                const response = await fetch(url.toString(), {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                 // Try to parse as JSON first
                 let data;
                 const responseText = await response.text();
                 console.log('Raw webhook response:', responseText.substring(0, 500));
                 console.log('Response status:', response.status, response.statusText);
                 // Show response in alert for mobile debugging
                 alert('Response: ' + response.status + '\nLength: ' + responseText.length + ' chars');
                 
                  try {
                      data = JSON.parse(responseText);
                      console.log('Parsed as JSON:', data);
                      
                      // Handle n8n error response format
                      if (data.status === 'error') {
                          data = { success: false, error: data.error };
                      }
                      // Handle n8n success response (if it returns JSON with name)
                      else if (data.name || data.Name) {
                          data = { success: true, Name: data.name || data.Name };
                      }
                  } catch (e) {
                      console.log('Not JSON, trying HTML parsing');
                      // Extract Name from HTML if present (n8n returns HTML)
                      const nameMatch = responseText.match(/Hi\s+([^<]+)/);
                      if (nameMatch && nameMatch[1]) {
                          data = { success: true, Name: nameMatch[1].trim() };
                      } else {
                          data = { success: false };
                      }
                  }
                
                if (data.success && data.Name) {
                    stopScanner();
                    showSuccess(data.Name);
                } else {
                    console.error('Check-in failed:', data);
                    showError();
                }
                 } catch (error) {
                console.error('Error processing QR code:', error);
                document.getElementById('result').textContent = 'Error: ' + error.message;
                // Show alert for mobile debugging
                alert('Error: ' + error.message + '\nCheck console for details');
                showError();
            }
        }

        function startScanner() {
            if (scannerActive) return;
            
            html5QrCode = new Html5Qrcode("reader");
            const qrCodeSuccessCallback = (decodedText) => {
                if (!isProcessing) {
                    processQRCode(decodedText);
                }
            };
            
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0,
                disableFlip: false
            };
            
            // Try rear camera first, fallback to any camera
            html5QrCode.start(
                { facingMode: { exact: "environment" } },
                config,
                qrCodeSuccessCallback,
                (errorMessage) => {
                    console.log('QR Code scan error:', errorMessage);
                }
            ).then(() => {
                scannerActive = true;
                updateStatus('Scanning...');
                document.getElementById('startScannerBtn').classList.add('hidden');
            }).catch(err => {
                console.error('Failed to start rear camera, trying any camera:', err);
                // Fallback to any available camera
                html5QrCode.start(
                    { facingMode: "user" },
                    config,
                    qrCodeSuccessCallback,
                    (errorMessage) => {
                        console.log('QR Code scan error:', errorMessage);
                    }
                ).then(() => {
                    scannerActive = true;
                    updateStatus('Scanning (front camera)...');
                    document.getElementById('startScannerBtn').classList.add('hidden');
                }).catch(fallbackErr => {
                    console.error('Failed to start any camera:', fallbackErr);
                    updateStatus('Camera error', false);
                    document.getElementById('startScannerBtn').classList.remove('hidden');
                });
            });
        }

        function stopScanner() {
            if (html5QrCode && scannerActive) {
                html5QrCode.stop().then(() => {
                    scannerActive = false;
                    // Clear the scanner element
                    const readerElement = document.getElementById('reader');
                    if (readerElement) {
                        readerElement.innerHTML = '';
                    }
                }).catch(err => {
                    console.error('Failed to stop scanner:', err);
                    scannerActive = false;
                });
            }
        }

        document.getElementById('scanNextBtn').addEventListener('click', () => {
            resetUI();
        });

        document.getElementById('retryBtn').addEventListener('click', () => {
            resetUI();
        });

        document.getElementById('startScannerBtn').addEventListener('click', startScanner);

        window.addEventListener('load', () => {
            // Check camera access with better error handling
            Html5Qrcode.getCameras().then(cameras => {
                if (cameras && cameras.length > 0) {
                    startScanner();
                } else {
                    updateStatus('No camera found', false);
                    document.getElementById('startScannerBtn').classList.remove('hidden');
                }
            }).catch(err => {
                console.error('Camera access error:', err);
                updateStatus('Camera access denied', false);
                document.getElementById('startScannerBtn').classList.remove('hidden');
            });
        });

        window.addEventListener('beforeunload', () => {
            stopScanner();
        });
    </script>
</body>
</html>
