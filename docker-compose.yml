version: '3.8'

services:
  qr-scanner:
    build: .
    container_name: qr-checkin-scanner
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qr-scanner.rule=Host(`checkin.rootinize.team`)"
      - "traefik.http.routers.qr-scanner.entrypoints=websecure"
      - "traefik.http.routers.qr-scanner.tls=true"
      - "traefik.http.routers.qr-scanner.tls.certresolver=letsencrypt"
      - "traefik.http.services.qr-scanner.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    environment:
      - N8N_WEBHOOK_URL=https://your-actual-n8n-webhook.com/webhook
    restart: unless-stopped
    networks:
      - traefik

networks:
  traefik:
    external: true